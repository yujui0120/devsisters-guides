<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devsisters 攻略影片集合</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-orange-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent cursor-pointer" onclick="goHome()">
          Devsisters 攻略影片集合
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">匯集各大授權頻道的精選遊戲攻略與最新動態</p>
        <!-- 更新時間顯示區塊 -->
        <p id="updateTimeDisplay" class="text-[11px] text-slate-500 mt-1">上次更新時間：載入中...（會在 15 分鐘內更新）</p>
      </div>
      <div class="w-full sm:w-80">
        <input type="text" id="globalSearch" placeholder="搜尋全站影片標題..." oninput="handleSearch(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-orange-500 transition-colors">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Loading State -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-24">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mb-4"></div>
      <p class="text-slate-400 text-sm">正在從授權頻道同步最新影片資料...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden bg-red-950/50 border border-red-800 rounded-xl p-6 text-center my-12">
      <h3 class="text-red-400 font-bold text-lg mb-2">無法載入影片資料</h3>
      <p id="errorMessage" class="text-red-300 text-sm mb-4"></p>
      <button onclick="loadYouTubeData()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">重新載入</button>
    </div>

    <!-- Dynamic Content Container -->
    <div id="appContainer" class="hidden space-y-12"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 mt-16 py-8 text-center text-sm text-slate-400">
    <p class="mb-2">網頁維護：餅乾基地Discord管理團隊</p>
    <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="text-orange-400 hover:text-orange-300 underline transition-colors">example.com(邀請連結)</a>
  </footer>

  <!-- Video Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeModal(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center p-4 border-b border-slate-800">
        <h3 id="modalTitle" class="font-bold text-lg truncate pr-4">影片播放</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="relative aspect-video bg-black">
        <iframe id="modalIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定區：頻道與分類關鍵字規則
    // ==========================================
    const CONFIG = {
      GAS_URL: "https://script.google.com/macros/s/AKfycbz_unyIgEY2kiTxCtMdWG-1H--6sLqh5Py1yYqec65lZCl5qq1qK18pDrVMfUEzLOT-jA/exec",

      // 授權頻道清單
      CHANNEL_IDS: [
        "UCT7W2GVaHtBuTu3kZJB0GwQ",
        "UCU9oAVsg-RghFBApVBjVn5A",
        "UC4O0Bsolr3brLF1jdo9v-jg",
        "UCG0QOZXtIAKYKUqzJbX45Fw"
      ],

      // 各主題遊戲分類與精準關鍵字
      CATEGORIES: {
        cookieRun: {
          name: "跑跑薑餅人 (烤箱大逃亡)",
          keywords: ["烤箱大逃亡", "ovenbreak", "cookierunovenbreak"]
        },
        kingdom: {
          name: "薑餅人王國",
          keywords: ["薑餅人王國", "王國", "cookierunkingdom", "kingdom"]
        },
        tower: {
          name: "薑餅人之塔",
          keywords: ["薑餅人之塔", "之塔", "towerofadventures", "toa"]
        },
        witchCastle: {
          name: "薑餅人魔女之城",
          keywords: ["魔女之城", "witchcastle"]
        },
        classic: {
          name: "薑餅人經典版",
          keywords: ["經典版", "classic"]
        },
        brawl: {
          name: "薑餅人大亂鬥",
          keywords: ["大亂鬥", "brawl"]
        },
        idleWar: {
          name: "薑餅人放置大戰爭",
          keywords: ["放置大戰爭", "idle"]
        }
      }
    };

    let allVideosData = [];
    let currentView = { type: 'home', categoryKey: null };
    let currentChannelFilter = 'all';

    // 初始化載入
    async function loadYouTubeData() {
      const loading = document.getElementById('loadingState');
      const errorDiv = document.getElementById('errorState');
      const container = document.getElementById('appContainer');

      loading.classList.remove('hidden');
      errorDiv.classList.add('hidden');
      container.classList.add('hidden');

      try {
        const url = `${CONFIG.GAS_URL}?channels=${CONFIG.CHANNEL_IDS.join(',')}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        allVideosData = data.items || [];
        allVideosData.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

        // 顯示上次更新時間
        if (data.lastUpdated) {
          document.getElementById('updateTimeDisplay').innerText = `上次更新時間：${data.lastUpdated}（會在 15 分鐘內更新）`;
        }

        loading.classList.add('hidden');
        container.classList.remove('hidden');
        render();
      } catch (err) {
        loading.classList.add('hidden');
        errorDiv.classList.remove('hidden');
        document.getElementById('errorMessage').innerText = err.message || "連線或解析資料失敗";
      }
    }

    // 判斷影片是否符合該主題類別
    function matchCategory(video, categoryKey) {
      const configCat = CONFIG.CATEGORIES[categoryKey];
      if (!configCat) return false;

      const textToCheck = (video.title + ' ' + (video.tags ? video.tags.join(' ') : '')).toLowerCase();
      return configCat.keywords.some(kw => textToCheck.includes(kw.toLowerCase()));
    }

    // 畫面渲染派發
    function render() {
      const container = document.getElementById('appContainer');
      const searchTerm = document.getElementById('globalSearch').value.trim().toLowerCase();

      if (searchTerm) {
        renderGlobalSearch(searchTerm, container);
        return;
      }

      if (currentView.type === 'home') {
        renderHome(container);
      } else if (currentView.type === 'category') {
        renderCategoryDetail(currentView.categoryKey, container);
      }
    }

    // 首頁：7大遊戲主題上下並排預覽
    function renderHome(container) {
      let html = '';
      for (const [key, cat] of Object.entries(CONFIG.CATEGORIES)) {
        const catVideos = allVideosData.filter(v => matchCategory(v, key));
        const previewVideos = catVideos.slice(0, 4);

        html += `
          <section class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-sm shadow-xl">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold tracking-wide flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
                ${cat.name}
              </h2>
              ${catVideos.length > 4 ? `
                <button onclick="openCategory('${key}')" class="text-sm text-orange-400 hover:text-orange-300 font-medium flex items-center gap-1 transition-colors">
                  查看全部 (${catVideos.length})
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              ` : ''}
            </div>
        `;

        if (catVideos.length === 0) {
          html += `<div class="text-slate-500 text-sm py-8 text-center bg-slate-950/40 rounded-xl border border-slate-800/50">目前尚無符合此主題的影片</div>`;
        } else {
          html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">`;
          previewVideos.forEach(video => {
            html += createVideoCardHTML(video);
          });
          html += `</div>`;
        }

        html += `</section>`;
      }
      container.innerHTML = html;
    }

    // 單一主題完整檢視頁
    function renderCategoryDetail(categoryKey, container) {
      const cat = CONFIG.CATEGORIES[categoryKey];
      let catVideos = allVideosData.filter(v => matchCategory(v, categoryKey));

      const activeChannelsMap = new Map();
      catVideos.forEach(v => {
        if (!activeChannelsMap.has(v.channelId)) {
          activeChannelsMap.set(v.channelId, v.channelTitle);
        }
      });

      if (currentChannelFilter !== 'all') {
        catVideos = catVideos.filter(v => v.channelId === currentChannelFilter);
      }

      let html = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div>
              <button onclick="goHome()" class="text-xs text-orange-400 hover:underline mb-2 flex items-center gap-1 font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                返回首頁總覽
              </button>
              <h2 class="text-2xl font-black">${cat.name} 完整攻略清單</h2>
            </div>
            
            <div class="flex flex-wrap gap-2">
              <button onclick="filterChannel('all')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${currentChannelFilter === 'all' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                全部頻道
              </button>
      `;

      activeChannelsMap.forEach((title, id) => {
        const isActive = currentChannelFilter === id;
        html += `
          <button onclick="filterChannel('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${isActive ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
            ${title}
          </button>
        `;
      });

      html += `</div></div>`;

      if (catVideos.length === 0) {
        html += `<div class="text-slate-500 text-sm py-16 text-center bg-slate-900 rounded-2xl border border-slate-800">此頻道或主題目前沒有影片</div>`;
      } else {
        html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">`;
        catVideos.forEach(video => {
          html += createVideoCardHTML(video);
        });
        html += `</div>`;
      }

      html += `
        <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-8 text-center space-y-4 mt-12">
          <p class="text-slate-400 text-sm font-medium">若您想要找尋更先前的影片 請至該頻道搜尋</p>
          <div class="flex flex-wrap justify-center gap-3">
      `;

      activeChannelsMap.forEach((title, id) => {
        html += `
          <a href="https://www.youtube.com/channel/${id}" target="_blank" rel="noopener noreferrer" class="bg-slate-800 hover:bg-slate-700 text-orange-400 hover:text-orange-300 px-4 py-2 rounded-xl text-xs font-medium transition-colors border border-slate-700 flex items-center gap-2">
            <span>前往 ${title} 頻道</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
        `;
      });

      html += `</div></div></div>`;
      container.innerHTML = html;
    }

    // 全站搜尋檢視
    function renderGlobalSearch(term, container) {
      const results = allVideosData.filter(v => 
        v.title.toLowerCase().includes(term) || v.channelTitle.toLowerCase().includes(term)
      );

      let html = `
        <div class="space-y-6">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex justify-between items-center">
            <h2 class="text-xl font-bold">搜尋結果：「${term}」</h2>
            <button onclick="clearSearch()" class="text-xs text-orange-400 hover:underline">清除搜尋</button>
          </div>
      `;

      if (results.length === 0) {
        html += `<div class="text-slate-500 text-sm py-16 text-center bg-slate-900 rounded-2xl border border-slate-800">找不到符合的影片</div>`;
      } else {
        html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">`;
        results.forEach(video => {
          html += createVideoCardHTML(video);
        });
        html += `</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function createVideoCardHTML(video) {
      const thumbUrl = video.thumbnails?.medium?.url || video.thumbnails?.default?.url || '';
      const pubDate = new Date(video.publishedAt).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });

      return `
        <div class="bg-slate-900 border border-slate-800/80 rounded-xl overflow-hidden hover:border-orange-500/50 transition-all duration-300 flex flex-col group shadow-md hover:shadow-orange-500/10">
          <div class="relative aspect-video bg-slate-950 overflow-hidden cursor-pointer" onclick="openVideo('${video.id}')">
            <img src="${thumbUrl}" alt="${escapeHtml(video.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
            <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors flex items-center justify-center">
              <div class="w-10 h-10 rounded-full bg-orange-600/90 text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
          </div>
          <div class="p-4 flex flex-col flex-grow justify-between gap-3">
            <div>
              <h3 onclick="openVideo('${video.id}')" class="font-bold text-sm text-slate-100 hover:text-orange-400 line-clamp-2 cursor-pointer transition-colors leading-snug" title="${escapeHtml(video.title)}">
                ${escapeHtml(video.title)}
              </h3>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800/80">
              <a href="https://www.youtube.com/channel/${video.channelId}" target="_blank" rel="noopener noreferrer" class="hover:text-orange-400 truncate max-w-[60%] transition-colors">
                ${escapeHtml(video.channelTitle)}
              </a>
              <span>${pubDate}</span>
            </div>
          </div>
        </div>
      `;
    }

    function openCategory(key) {
      currentView = { type: 'category', categoryKey: key };
      currentChannelFilter = 'all';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function goHome() {
      currentView = { type: 'home', categoryKey: null };
      currentChannelFilter = 'all';
      document.getElementById('globalSearch').value = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function filterChannel(channelId) {
      currentChannelFilter = channelId;
      render();
    }

    function handleSearch(val) {
      render();
    }

    function clearSearch() {
      document.getElementById('globalSearch').value = '';
      render();
    }

    function openVideo(videoId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('modalIframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modal.classList.remove('hidden');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'videoModal' || e.target.closest('button')) {
        const modal = document.getElementById('videoModal');
        const iframe = document.getElementById('modalIframe');
        iframe.src = '';
        modal.classList.add('hidden');
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    loadYouTubeData();
  </script>
</body>
</html>
